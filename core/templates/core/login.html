<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Авторизация — NEKTO Voice 侍</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;800&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #090a0f;
            color: #e2e8f0;
            font-family: 'Noto Sans JP', sans-serif;
            display: flex; align-items: center; justify-content: center; height: 100vh;
            background-image: radial-gradient(circle at 50% 50%, rgba(255,0,85,0.15) 0%, transparent 60%);
        }
        .font-cyber { font-family: 'Orbitron', sans-serif; }
        .card-custom {
            background-color: #12141d;
            border: 1px solid #2a2e3d;
            border-top: 3px solid #ff0055;
            width: 100%; max-width: 400px;
            box-shadow: 0 0 25px rgba(255, 0, 85, 0.2);
        }
        .form-control { background-color: #090a0f; border: 1px solid #2a2e3d; color: #fff; }
        .form-control:focus { background-color: #090a0f; color: #fff; border-color: #ff0055; box-shadow: 0 0 10px rgba(255,0,85,0.4); }
        .btn-samurai {
            background: linear-gradient(135deg, #ff0055, #990033);
            color: #fff; border: none; font-weight: bold;
            box-shadow: 0 0 15px rgba(255, 0, 85, 0.4);
        }
        .btn-samurai:hover { color: #fff; box-shadow: 0 0 25px rgba(255, 0, 85, 0.7); }
    </style>
</head>
<body>
    <div class="card card-custom p-4 rounded-4">
        <h3 class="fw-bold text-center font-cyber text-white mb-1">NEKTO VOICE</h3>
        <p class="text-center text-danger font-cyber small mb-4">🔒 ВХОД ДЛЯ КОМАНДЫ (ログイン)</p>
        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label small text-secondary">ЛОГИН ВОИНА</label>
                <input type="text" name="username" class="form-control" required>
            </div>
            <div class="mb-4">
                <label class="form-label small text-secondary">ПАРОЛЬ</label>
                <input type="password" name="password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-samurai w-100 py-2 font-cyber">ВОЙТИ В СИСТЕМУ ⚔</button>
        </form>
        <div class="text-center mt-3">
            <a href="/" class="text-secondary text-decoration-none small">⬅ Вернуться на сайт</a>
        </div>
    </div>
</body>
</html>
